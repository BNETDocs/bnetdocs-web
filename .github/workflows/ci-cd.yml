# vim: set colorcolumn=:
name: ci-cd

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linter:
    name: linter (PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5'] # keep the oldest in step with composer.json
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, xml
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress

      # Production reports E_DEPRECATED, so this fails on compile-time deprecations too.
      - name: Validate PHP syntax and deprecations
        run: |
          for file in $(find ./src ./tests -type f -regex ".*\.\(php\|phtml\)" -not -path "./src/Static/*" -print); do
            out="$(php -d error_reporting=-1 -d display_errors=stderr -d log_errors=0 -d short_open_tag=On -l -f "$file" 2>&1)" || { echo "$out"; exit 1; }
            echo "$out"
            if grep -q '^Deprecated:' <<< "$out"; then exit 1; fi
          done

  phpstan:
    needs: [linter]
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, mbstring, pdo_mysql, xml
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: lib/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

  tests:
    name: tests (PHP ${{ matrix.php }})
    needs: [linter]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5'] # keep the oldest in step with composer.json
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, xml
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: lib/bin/phpunit --testdox

  deploy:
    needs: [linter, phpstan, tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/phoenix')
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # Everything
          fetch-tags: true

      - name: Install PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: curl, mbstring, pdo_mysql, xml
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: lib
          key: ${{ runner.os }}-php8.5-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.5-

      - name: Install composer/vendor dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Sanitize Branch Name
        run: |
          CLEAN_BRANCH_NAME="${GITHUB_REF_NAME//\//_}"
          echo "CLEAN_BRANCH_NAME=${CLEAN_BRANCH_NAME}" >> $GITHUB_ENV

      - name: Create Config
        env:
          WEB_CONFIG_JSON: ${{ secrets.WEB_CONFIG_JSON }}
        run: |
          echo "${WEB_CONFIG_JSON}" > ./etc/config.phoenix.json
          jq -c -e . ./etc/config.phoenix.json 1>/dev/null

      - name: Create Version file
        run: |
          #!/usr/bin/env bash
          set -ex -o pipefail

          # Version identifier
          echo "$(git describe --always --tags)" > ./etc/deploy-version.txt
          # Version hash
          echo "$(git rev-parse HEAD)" >> ./etc/deploy-version.txt
          # Version ISO8601 timestamp
          echo "$(git log -n 1 --pretty='%aI' HEAD)" >> ./etc/deploy-version.txt
          # LICENSE version and ISO8601 timestamp
          echo -n "$(git log -n 1 --pretty='%h %aI' ./LICENSE.txt)" >> ./etc/deploy-version.txt

      - name: Deploy to Remote
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }} # SSH private key stored as a GitHub secret
          SSH_WEB_PATH: ${{ secrets.SSH_WEB_PATH }}
        run: |
          #!/usr/bin/env bash
          set -ex -o pipefail

          # Setup SSH directory, known hosts, and private key
          mkdir -pv "${HOME}/.ssh"
          echo "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod -v 644 "${HOME}/.ssh/known_hosts"
          echo "${SSH_KEY}" > "${HOME}/.ssh/id_${SSH_USER}"
          chmod -v 400 "${HOME}/.ssh/id_${SSH_USER}"

          # Deploy artifact to the remote
          rsync -avzc --delete --delete-excluded --delete-after --progress \
            --exclude-from="./etc/deploy-ignore.txt" \
            --chown=${SSH_USER}:${SSH_USER} \
            -e "ssh -i ${HOME}/.ssh/id_${SSH_USER} -p ${SSH_PORT}" \
            "./" "${SSH_USER}@${SSH_HOST}:${SSH_WEB_PATH}/${CLEAN_BRANCH_NAME}"

          # Cleanup the secret
          rm -fv "${HOME}/.ssh/id_${SSH_USER}" "${HOME}/.ssh/id_${SSH_USER}.pub"

      - name: Cleanup Config
        if: always()
        run: |
          rm -fv ./etc/config.phoenix.json
